spark.master                             spark://spark-master:7077

# S3A vers RustFS. Les identifiants viennent des variables AWS des conteneurs.
spark.hadoop.fs.s3a.endpoint             http://rustfs:9000
spark.hadoop.fs.s3a.endpoint.region      us-east-1
spark.hadoop.fs.s3a.path.style.access    true
spark.hadoop.fs.s3a.impl                 org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled false

# Paramètres du cluster pédagogique.
spark.executor.cores                     1
spark.executor.memory                    1g
spark.driver.memory                      1g
spark.driver.maxResultSize               256m
spark.deploy.defaultCores                4
spark.sql.shuffle.partitions             16
spark.sql.files.maxPartitionBytes        32m
spark.default.parallelism                4
spark.serializer                         org.apache.spark.serializer.KryoSerializer
spark.sql.session.timeZone               UTC
spark.sql.ansi.enabled                   false
spark.sql.warehouse.dir                  file:///opt/spark/warehouse
spark.ui.showConsoleProgress             true
spark.jars.ivy                           /tmp/spark-ivy

# Journaux partagés avec Spark History Server.
spark.eventLog.enabled                   true
spark.eventLog.compress                  true
spark.eventLog.dir                       file:///opt/spark/events
spark.history.fs.logDirectory            file:///opt/spark/events
spark.history.fs.cleaner.enabled         true
spark.history.fs.cleaner.interval        7d
spark.history.fs.cleaner.maxAge          90d
spark.history.ui.port                    18080

spark.pyspark.python                     python3
spark.pyspark.driver.python              python3
